<style>
  :root {
    --width: 720px;
    --font-main: system-ui, -apple-system, sans-serif;
    --font-secondary: system-ui, -apple-system, sans-serif;
    --font-scale: 1em;
    --background-color: #ffffff;
    --heading-color: #111111;
    --text-color: #222222;
    --link-color: #0066cc;
    --visited-color: #551a8b;
    --blockquote-color: #444444;
    --code-bg: #f4f4f4;
    --code-text: #222222;
    --code-border: #cccccc;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --background-color: #121212;
      --heading-color: #eeeeee;
      --text-color: #dddddd;
      --link-color: #63a4ff;
      --visited-color: #c792ea;
      --blockquote-color: #bbbbbb;
      --code-bg: #1e1e1e;
      --code-text: #eeeeee;
      --code-border: #333333;
    }
  }

  body {
    font-family: var(--font-secondary);
    font-size: var(--font-scale);
    margin: auto;
    padding: 20px;
    max-width: var(--width);
    text-align: left;
    background-color: var(--background-color);
    word-wrap: break-word;
    overflow-wrap: break-word;
    line-height: 1.6;
    color: var(--text-color);
  }

  h1, h2, h3, h4, h5, h6 {
    font-family: var(--font-main);
    color: var(--heading-color);
  }

  a {
    color: var(--link-color);
    cursor: pointer;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  nav a {
    margin-right: 8px;
  }

  strong, b {
    color: var(--heading-color);
  }

  button {
    margin: 0;
    cursor: pointer;
  }

  time {
    font-family: ui-monospace, monospace;
    font-size: 0.9em;
  }

  main {
    line-height: 1.6;
  }

  table {
    width: 100%;
  }

  hr {
    border: 0;
    border-top: 1px dashed var(--code-border);
  }

  img {
    max-width: 100%;
  }

  /* Inline Code */
  code {
    font-family: ui-monospace, monospace;
    background-color: var(--code-bg);
    color: var(--code-text);
    padding: 2px 5px;
    border-radius: 3px;
    font-size: 0.9em;
  }

  /* Code Blocks (<pre><code>) */
  pre {
    background-color: var(--code-bg);
    color: var(--code-text);
    padding: 12px;
    border-radius: 4px;
    border: 1px solid var(--code-border);
    overflow-x: auto;
    font-family: ui-monospace, monospace;
    font-size: 0.9em;
    line-height: 1.45;
  }

  pre code {
    background-color: transparent;
    padding: 0;
    border-radius: 0;
    color: inherit;
  }

  blockquote {
    border-left: 2px solid var(--code-border);
    color: var(--blockquote-color);
    padding-left: 15px;
    margin-left: 0;
    font-style: italic;
  }

  footer {
    padding: 25px 0;
    text-align: center;
  }

  .title:hover {
    text-decoration: none;
  }

  .title h1 {
    font-size: 1.5em;
  }

  .highlight, .code {
    border-radius: 4px;
    margin-block: 1em;
    overflow-x: auto;
  }

  /* Blog post list */
  ul.blog-posts {
    list-style-type: none;
    padding: unset;
  }

  ul.blog-posts li {
    display: flex;
  }

  ul.blog-posts li span {
    flex: 0 0 130px;
  }

  ul.blog-posts li a:visited {
    color: var(--visited-color);
  }
</style>
